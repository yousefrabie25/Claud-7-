name: Cloud7 Smoke CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker compose build smoke
        working-directory: cloud7-automation

      - name: Run Smoke Tests
        run: docker compose run --rm smoke
        working-directory: cloud7-automation
        env:
          BASE_URL: https://cloud7.io
          WRITE_TESTS: "false"
          ALLOW_PROD_WRITES: "false"
          SKIP_KNOWN: "true"

      - name: Upload Playwright Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: |
            cloud7-automation/playwright-report/
            cloud7-automation/test-results/
          if-no-files-found: ignore
          retention-days: 14