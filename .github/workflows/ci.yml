      #name: Cloud7 Automation CI

# STEP 1: Define workflow triggers
on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

# STEP 2: Define jobs
jobs:

  # STEP 3: Smoke Testing Job
  smoke-tests:

    # Select the operating system
    runs-on: ubuntu-latest

    # Define execution steps
    steps:

      # Download repository code
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      # Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm

      # Install project dependencies
      - name: Install dependencies
        run: npm ci

      # Install Playwright browser
      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      # Run TypeScript validation
      - name: TypeScript Check
        run: npm run typecheck

      # Build Docker Image
      - name: Build Docker Image
        run: docker compose build smoke

      # Execute Smoke Tests inside Docker
      - name: Run Smoke Tests
        run: docker compose run --rm smoke
        env:
          BASE_URL: https://cloud7.io
          WRITE_TESTS: "false"
          ALLOW_PROD_WRITES: "false"
          SKIP_KNOWN: "true"

      # Collect Blob Reports
      - name: Prepare Blob Reports
        if: always()
        run: |
          mkdir -p all-blob-reports
          cp blob-report/*.zip all-blob-reports/ || true

      # Merge Playwright Reports
      - name: Merge Playwright Reports
        if: always()
        run: npm run report:merge

      # Upload test reports
      - name: Upload Playwright Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports
          path: |
            playwright-report/
            reports/
            test-results/
            blob-report/
          if-no-files-found: ignore
          retention-days: 14